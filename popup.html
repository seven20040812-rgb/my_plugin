<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日励志语录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 320px;
    min-height: 260px;
    background: #FDFBF7;
    color: #3a3a3a;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid #EDE6DA;
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(120, 100, 70, 0.08);
    animation: slideIn 0.35s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .header .dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F5C86B, #E89B4C);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #6B5E4F;
    letter-spacing: 1px;
  }

  .quote-wrap {
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  #quote {
    font-size: 17px;
    line-height: 1.7;
    color: #3a3a3a;
    font-weight: 500;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  #quote.fade-out {
    opacity: 0;
    transform: translateY(6px);
  }

  #quote.fade-in {
    opacity: 1;
    transform: translateY(0);
  }

  #author {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: #A89C8A;
    transition: opacity 0.3s ease;
  }

  #author.fade-out { opacity: 0; }

  #newBtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    cursor: pointer;
    background: #3a3a3a;
    color: #FDFBF7;
    font-size: 14px;
    padding: 10px 28px;
    border-radius: 999px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 2px 10px rgba(58, 58, 58, 0.2);
  }

  #newBtn:hover {
    background: #4a4a4a;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(58, 58, 58, 0.28);
  }

  #newBtn:active { transform: translateY(0) scale(0.97); }

  .footer {
    margin-top: 14px;
    font-size: 11px;
    color: #C9BFAE;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="dot">☀️</span>
      <h1>每日励志语录</h1>
    </div>
    <div class="quote-wrap">
      <p id="quote">正在为你准备正能量…</p>
    </div>
    <span id="author"></span>
    <button id="newBtn">✨ 换一句</button>
    <div class="footer">愿你每天都充满力量</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
